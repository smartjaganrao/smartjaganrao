<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Jagan — Senior React Developer to AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#121A33"/>
      <stop offset="1" stop-color="#1B1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61DAFB"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#61DAFB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#61DAFB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .orbit { transform-origin: 960px 150px; animation: spin 24s linear infinite; }
      .orbit2 { transform-origin: 960px 150px; animation: spin 16s linear infinite reverse; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .node { animation: blink 2.4s ease-in-out infinite; }
      .n2 { animation-delay: .8s; } .n3 { animation-delay: 1.6s; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      text { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- React-meets-AI emblem -->
  <circle cx="960" cy="150" r="140" fill="url(#glow)" class="pulse"/>
  <g class="orbit" fill="none" stroke="url(#accent)" stroke-width="3" stroke-opacity="0.9">
    <ellipse cx="960" cy="150" rx="110" ry="40"/>
    <ellipse cx="960" cy="150" rx="110" ry="40" transform="rotate(60 960 150)"/>
    <ellipse cx="960" cy="150" rx="110" ry="40" transform="rotate(120 960 150)"/>
  </g>
  <g class="orbit2">
    <circle cx="1070" cy="150" r="6" fill="#A78BFA"/>
    <circle cx="905" cy="55" r="5" fill="#61DAFB"/>
    <circle cx="905" cy="245" r="5" fill="#61DAFB"/>
  </g>
  <!-- neural core -->
  <g stroke="#E2E8F0" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="940" y1="135" x2="980" y2="135"/>
    <line x1="940" y1="135" x2="960" y2="168"/>
    <line x1="980" y1="135" x2="960" y2="168"/>
  </g>
  <circle cx="940" cy="135" r="7" fill="#61DAFB" class="node"/>
  <circle cx="980" cy="135" r="7" fill="#A78BFA" class="node n2"/>
  <circle cx="960" cy="168" r="7" fill="#F0ABFC" class="node n3"/>

  <!-- Text -->
  <text x="70" y="98" fill="#94A3B8" font-size="20" letter-spacing="3">HI, I'M</text>
  <text x="68" y="160" fill="#F8FAFC" font-size="64" font-weight="700">Jagan</text>
  <rect x="70" y="182" width="96" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="225" fill="#E2E8F0" font-size="26" font-weight="600">Senior React Developer <tspan fill="url(#accent)">→ AI Engineer</tspan></text>
  <text x="70" y="260" fill="#94A3B8" font-size="17">9+ yrs BFSI @ Capgemini  ·  Building AI SaaS  ·  React Trainer  ·  Chennai, India</text>
</svg>
